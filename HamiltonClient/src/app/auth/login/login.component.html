            <h3>Login</h3>
          </div>
          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" class="form-control" placeholder="Your Email" autocomplete="off" formControlName="email">
              <div class="text-danger" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                <div *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</div>
                <div *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format.</div>
              </div>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" class="form-control" placeholder="Your Password" formControlName="password">
              <div class="text-danger" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                <div *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</div>
                <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 8 characters.</div>
              </div>
            </div>
            <div class="d-flex justify-content-between mb-4">
              <div class="form-check">
                <!-- <input class="form-check-input" type="checkbox" value="" id="remember">
                <label class="form-check-label" for="remember">
                  Remember Me
                </label> -->
              </div>
              <a [routerLink]="['/auth/forgot-password']" class="forgot-pass">Forgot Password?</a>
            </div>
            <div class="d-flex align-items-center">
              <button type="submit" class="login-btn"><i class="far fa-sign-in"></i> Login</button>
            </div>
          </form>
          <!-- <div class="login-footer">
            <p>Don't have an account? <a href="register.html">Register.</a></p>
          </div> -->
        </div>
      </div>
    </div>
  </div>

  <!-- login area end -->

<!-- OTP Modal -->
<div *ngIf="otpStep" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-lg shadow-lg w-96 login-form">
    <div class="login-header">
      <h3>Verify Your OTP</h3>
    </div>
    <p class="mb-4 text-gray-600">OTP sent to {{emailForOtp}}</p>
    <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()">
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Enter OTP" autocomplete="off" maxlength="6" formControlName="otp">
        <div class="text-danger" *ngIf="otpForm.get('otp')?.invalid && otpForm.get('otp')?.touched">
          <div *ngIf="otpForm.get('otp')?.errors?.['required']">OTP is required.</div>
        </div>
      </div>
        <div class="d-flex align-items-center">
          <button type="submit" class="login-btn"> Verify OTP</button>
        </div>
    </form>
    <button (click)="otpStep = false" class="mt-3 text-sm text-gray-500 hover:text-gray-700">Cancel</button>
  </div>
</div>


<!-- Trigger button -->
<!-- <button onclick="document.getElementById('myModal').classList.remove('hidden')">Open Modal</button> -->

<!-- Modal container -->
<div id="myModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
  <!-- Modal dialog -->
  <div class="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full">
    <h3 class="text-lg font-bold mb-4">Modal Title</h3>
    <p class="mb-4">This is the content of your modal.</p>
    <button onclick="document.getElementById('myModal').classList.add('hidden')"
      class="bg-blue-500 text-white px-4 py-2 rounded">Close</button>
  </div>
</div>


<!-- Agreement Modal -->
<div *ngIf="showAgreementModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full login-form">
    <h3 class="text-lg font-bold mb-4">Agreement</h3>
    <p class="mb-4">Please accept the agreement to continue.</p>
    <div class="d-flex mb-4">
      <input type="checkbox" id="acceptAgreement" [(ngModel)]="agreementChecked" class="mr-2">
      <label for="acceptAgreement">I accept the agreement</label>
    </div>
    <!-- <div class="flex justify-end gap-2">
      <button [disabled]="!agreementChecked" (click)="acceptAgreement()"
      class="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50">Accept</button>
    </div> -->
    <div class="d-flex align-items-center">
      <button (click)="closeAgreementModal()" class="bg-gray-400 text-white px-4 py-2 rounded">Cancel</button>
      <button type="submit" class="login-btn" [disabled]="!agreementChecked" (click)="acceptAgreement()"> Accept</button>
    </div>
  </div>
</div>



</main>
