<div>
  <div>
    <div class="mb-3 flex items-center justify-between">
      <h5 class="text-lg font-semibold dark:text-white-light">Create Destination</h5>
    </div>
    <div>
      <div>
        <form [formGroup]="destinationForm"
          class="mb-4 rounded-md border border-[#ebedf2] bg-white p-4 dark:border-[#191e3a] dark:bg-[#0e1726]">
          <div class="flex flex-col sm:flex-row">
            <div class="grid flex-1 grid-cols-1 gap-5 sm:grid-cols-2">

              <div [ngClass]="isSubmitForm ? destinationForm.get('name').invalid ? 'has-error' : 'has-success' : ''">
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Name" class="form-input" formControlName="name" />
                <ng-container *ngIf="isSubmitForm && !destinationForm.get('name').invalid">
                  <p class="mt-1 ml-2 text-[#1abc9c]">Looks Good!</p>
                </ng-container>
                <ng-container
                  *ngIf="isSubmitForm && destinationForm.get('name').invalid && destinationForm.get('name').touched">
                  <p class="mt-1 ml-2 text-danger">Please enter a valid name</p>
                </ng-container>
              </div>

              <div
                [ngClass]="isSubmitForm ? destinationForm.get('location').invalid ? 'has-error' : 'has-success' : ''">
                <label for="location">Location</label>
                <input id="location" type="text" placeholder="Location" class="form-input" autocomplete="off"
                  formControlName="location" />
                <ng-container *ngIf="isSubmitForm && !destinationForm.get('location').invalid">
                  <p class="mt-1 ml-2 text-[#1abc9c]">Looks Good!</p>
                </ng-container>
                <ng-container
                  *ngIf="isSubmitForm && destinationForm.get('location').invalid && destinationForm.get('location').touched">
                  <p class="mt-1 ml-2 text-danger">Please enter a valid location</p>
                </ng-container>
              </div>
              <div
                [ngClass]="isSubmitForm ? destinationForm.get('category').invalid ? 'has-error' : 'has-success' : ''">
                <label for="category">Category</label>
                <select id="category" class="form-select" formControlName="category">
                  <option value="Domestic">Domestic</option>
                  <option value="International">Hashtag</option>
                </select>
              </div>
            </div>
          </div>

          <div class="mt-5"
            [ngClass]="isSubmitForm ? destinationForm.get('description').invalid ? 'has-error' : 'has-success' : ''">
            <label for="description">Description</label>
            <textarea id="description" placeholder="Description..." class="form-textarea min-h-[130px]"
              formControlName="description"></textarea>
            <ng-container *ngIf="isSubmitForm && !destinationForm.get('description').invalid">
              <p class="mt-1 ml-2 text-[#1abc9c]">Looks Good!</p>
            </ng-container>
            <ng-container
              *ngIf="isSubmitForm && destinationForm.get('description').invalid && destinationForm.get('description').touched">
              <p class="mt-1 ml-2 text-danger">Please enter a valid description</p>
            </ng-container>
          </div>
        </form>

        <div class="rounded-md border border-[#ebedf2] bg-white p-4 dark:border-[#191e3a] dark:bg-[#0e1726]">
          <div data-upload-id="mySecondImage" class="custom-file-container">
            <div class="label-container">
              <label>Upload Images</label>
            </div>
            <label class="input-container">
              <input accept="*" aria-label="Choose File" class="input-hidden" (change)="onImageChange($event)"
                id="file-upload-with-preview-mySecondImage" multiple type="file" />
              <span class="input-visible">Choose file...<span class="browse-button">Browse</span></span>
            </label>
            <div class="image-preview" *ngIf="imagePreviews.length < 1"
              style="background-image: url('../../../../../assets/admin/images/file-preview.svg');">
            </div>
            <div class="image-preview" *ngIf="imagePreviews.length > 0">
              <div *ngFor="let preview of imagePreviews; let i = index" class="image-preview-item"
                style="background-image: url({{preview}}); ">

                <span class="image-preview-item-clear" (click)="removeImage(i)">
                  <span class="image-preview-item-clear-icon" data-upload-name="red.jpg:upload:02d900ca7335d">
                    ×
                  </span>
                </span>

              </div>
            </div>
          </div>

          <!-- Save Button -->
          <div
            class="flex flex-cols-1 gap-4 sm:flex-cols-2 lg:flex-cols-4 xl:flex-cols-1 justify-center lg:justify-end ">
            <button type="button" class="btn btn-danger sm:w-full lg:w-1/4 gap-2" (click)="onCancel()">
              <icon-x class="shrink-0 ltr:mr-2 rtl:ml-2" />
              Cancel
            </button>
            <button type="button" class="btn btn-success sm:w-full lg:w-1/4 gap-2" (click)="onSave()">
              <icon-save class="shrink-0 ltr:mr-2 rtl:ml-2" />
              Create
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
